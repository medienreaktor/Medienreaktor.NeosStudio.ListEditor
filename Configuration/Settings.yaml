Medienreaktor:
  NeosStudio:
    # Register this package's bundle with the Studio shell. The
    # StudioController reads this map and injects the assets into the served
    # SPA. Build the bundle with
    #   cd Resources/Private/Plugin && npm install && npm run build
    # which emits the referenced files into Resources/Public/Plugin.
    plugins:
      "Medienreaktor.NeosStudio.ListEditor":
        javascript: "resource://Medienreaktor.NeosStudio.ListEditor/Public/Plugin/plugin.js"
        stylesheet: "resource://Medienreaktor.NeosStudio.ListEditor/Public/Plugin/plugin.css"
        position: 100

Neos:
  Neos:
    userInterface:
      translation:
        # The plugin resolves its own UI strings through the same
        # XLIFF-as-JSON endpoint the shell loads, which only serves
        # auto-included packages.
        autoInclude:
          Medienreaktor.NeosStudio.ListEditor:
            - Main
